# GitHub Actions workflow for continuous integration.
# This workflow builds and tests the zvuk-grabber project on every push and PR.
# Release automation is handled separately in release.yaml workflow.

name: Build and Test

# Define when this workflow should be triggered.
on:
  # Run on all pull requests.
  pull_request:
  # Run on pushes to the default release branch only.
  push:
    branches: [master]
  # Allow this workflow to be called from other workflows as a reusable workflow.
  workflow_call:
  # Enable manually triggering this workflow via the API or web UI.
  workflow_dispatch:

# Environment variables (constants for configuration).
env:
  # Tool versions.
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GO_VERSION: "1.27.1"

  # Test configuration.
  TEST_TIMEOUT: "600s"

# Set default configuration for all run commands in this workflow.
defaults:
  run:
    # Use bash as the default shell for all run steps.
    shell: bash

# Define all jobs that will run as part of this workflow.
jobs:
  # Job to check code quality and style using golangci-lint.
  lint:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository code with full git history.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Fetch all commits and branches for complete history.
          fetch-depth: 0
      - name: Ensure local config is absent
        run: |
          if [ -f .zvuk-grabber.yaml ]; then
            echo "Error: .zvuk-grabber.yaml must not exist in repository root."
            echo "Use .zvuk-grabber.example.yaml instead."
            exit 1
          fi
          if git ls-files --error-unmatch .zvuk-grabber.yaml >/dev/null 2>&1; then
            echo "Error: .zvuk-grabber.yaml must not be committed. Use .zvuk-grabber.example.yaml."
            exit 1
          fi
      # Run golangci-lint to check code quality, style, and potential bugs.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # Job to test the application on multiple platforms.
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      # Continue running other matrix jobs even if one fails.
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Toolchain info
        run: |
          go version
          go env GOOS
          go env GOARCH
          go env GOTOOLCHAIN
          go env GOVERSION
      - name: Run tests
        run: go test -race -timeout ${{ env.TEST_TIMEOUT }} ./...

  # Job to verify that the application builds correctly.
  test-build:
    runs-on: ${{ matrix.platform }}
    strategy:
      # Continue running other matrix jobs even if one fails.
      fail-fast: false
      # Create a matrix of 2 jobs: 2 platforms.
      matrix:
        platform: [ubuntu-latest, windows-latest]
    steps:
      # Checkout the repository code.
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Toolchain info
        run: |
          go version
          go env GOOS
          go env GOARCH
          go env GOTOOLCHAIN
          go env GOVERSION
      - name: Check build
        run: |
          pwd && ls -l
          go build -v ./...
          if [ -f "./zvuk-grabber" ]; then
            ./zvuk-grabber --help
          elif [ -f "./zvuk-grabber.exe" ]; then
            ./zvuk-grabber.exe --help
          fi
